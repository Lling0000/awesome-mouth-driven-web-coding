name: Suggest an Awesome resource
description: Recommend a resource for AWESOME.md
title: "awesome: add "
labels: ["awesome", "documentation"]
body:
  - type: input
    id: url
    attributes:
      label: URL
      description: Link to the resource.
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Why it belongs here
      description: Explain how it helps voice-first web coding, frontend building, design, debugging, or shipping.
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - AI Coding Tools
        - Voice Input and macOS
        - Web Fundamentals
        - UI and Component Inspiration
        - Visual Taste and Product Pages
        - Icons, Images, and Assets
        - Deployment
        - High-Star README References
    validations:
      required: true
